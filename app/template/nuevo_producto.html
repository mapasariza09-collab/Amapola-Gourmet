{% extends "base.html" %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="container my-5">
    <h2>Agregar Nuevo Producto</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" name="precio" step="0.01" required>
        </div>
        <div class="mb-3">
            <label for="img" class="form-label">URL de Imagen</label>
            <input type="url" class="form-control" id="img" name="img" required>
        </div>
        <button type="submit" class="btn btn-success">Agregar Producto</button>
        <a href="{{ url_for('main.admin_productos') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
