{% extends "base.html" %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="container my-5">
    <h2>Agregar Nuevo Producto</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" name="precio" step="0.01" required>
        </div>
        <div class="mb-3">
            <label for="img" class="form-label">Imagen del Producto</label>
            <input type="file" class="form-control" id="img" name="img" accept="image/*" required>
            <small class="form-text text-muted">Selecciona una imagen (JPG, PNG, etc.)</small>

            <div id="image-preview" class="mt-3" style="display: none;">
                <small class="text-muted">Vista previa (como se verá en la tarjeta del menú):</small>
                <div style="width: 100%; max-width: 320px; height: 220px; border: 1px solid #ddd; border-radius: 15px 15px 0 0; overflow: hidden; margin-top: 8px; background: #f8f9fa;">
                    <img id="preview-img" src="" alt="Vista previa" 
                         style="width: 100%; height: 220px; object-fit: cover; display: block;">
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Agregar Producto</button>
        <a href="{{ url_for('main.admin_productos') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
document.getElementById('img').addEventListener('change', function() {
    const previewContainer = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    
    if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            previewImg.src = e.target.result;
            previewContainer.style.display = 'block';
        };
        reader.readAsDataURL(this.files[0]);
    } else {
        previewContainer.style.display = 'none';
    }
});
</script>
{% endblock %}
