{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<style>
body {
    background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200&h=800&fit=crop') no-repeat center center fixed;
    background-size: cover;
}
.container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    padding: 30px;
    margin-top: 100px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
</style>
    <div class="row justify-content-center">
    <div class="col-md-4 login-form">
        <h2>Iniciar Sesión</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="correo">Usuario / Correo</label>
                <input type="text" class="form-control" id="correo" name="correo" value="{{ identificador or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
        <p class="mt-3">¿Olvidaste tu contraseña? <a href="{{ url_for('auth.forgot_password') }}">Recupérala aquí</a></p>
        <p class="mt-3">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Animación adicional si es necesario
});
</script>
{% endblock %}
