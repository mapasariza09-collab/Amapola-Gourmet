{% extends "base.html" %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<style>
body {
    background: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1200&h=800&fit=crop') no-repeat center center fixed;
    background-size: cover;
}
.container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    padding: 30px;
    margin-top: 100px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
</style>
<div class="row justify-content-center">
    <div class="col-md-4 login-form">
        <h2>Recuperar Contraseña</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Enlace de Recuperación</button>
        </form>
        <p class="mt-3"><a href="{{ url_for('auth.login') }}">Volver al Inicio de Sesión</a></p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Animación adicional si es necesario
});
</script>
{% endblock %}
